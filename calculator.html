<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 1px;
    text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
    margin-bottom: 20px;
  }

  .calculator {
    width: 100%;
    max-width: 340px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
  }

  .display {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    word-break: break-all;
  }

  .expression {
    font-size: 1.1rem;
    color: #9fd8ef;
    min-height: 22px;
    opacity: 0.9;
  }

  .result {
    font-size: 2.4rem;
    font-weight: 600;
    line-height: 1.1;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    font-family: inherit;
    font-size: 1.3rem;
    padding: 16px 0;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  button:active {
    transform: scale(0.94);
  }

  .op {
    background: rgba(255, 165, 0, 0.35);
  }

  .op:hover {
    background: rgba(255, 165, 0, 0.5);
  }

  .clear {
    background: rgba(244, 67, 54, 0.5);
    grid-column: span 2;
  }

  .clear:hover {
    background: rgba(244, 67, 54, 0.7);
  }

  .equals {
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    grid-column: span 2;
  }

  .equals:hover {
    filter: brightness(1.15);
  }

  .warning {
    color: #ffb3b3;
    font-size: 0.9rem;
    min-height: 20px;
    margin-top: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Simple Calculator</h1>

  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button class="clear" id="clear">C</button>
      <button class="clear" id="backspace">&#9003;</button>
      <button class="op" data-op="&#247;">&#247;</button>
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="&#215;">&#215;</button>
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">-</button>
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>
      <button data-num="0">0</button>
      <button data-num=".">.</button>
      <button class="equals" id="equals">=</button>
    </div>

    <div class="warning" id="warning"></div>
  </div>

<script>
  const expressionEl = document.getElementById("expression");
  const resultEl = document.getElementById("result");
  const warningEl = document.getElementById("warning");

  let expression = "";
  let current = "";
  let lastWasOperator = false;

  function render() {
    expressionEl.textContent = expression;
    resultEl.textContent = current === "" ? "0" : current;
  }

  function setWarning(msg) {
    warningEl.textContent = msg;
  }

  function appendNumber(num) {
    setWarning("");
    if (num === "." && current.includes(".")) return;
    if (current === "0" && num !== ".") current = num;
    else current += num;
    lastWasOperator = false;
    render();
  }

  function chooseOperator(op) {
    setWarning("");
    if (expression === "" && current === "") return;
    if (current !== "") {
      expression = (expression + " " + current).trim() + " " + op;
      current = "";
    } else {
      expression = expression.slice(0, -1) + op;
    }
    lastWasOperator = true;
    render();
  }

  function calculate() {
    if (current === "") return;
    const full = expression + " " + current;
    const parts = full.split(" ");
    let total = parseFloat(parts[0]);
    for (let i = 1; i < parts.length; i += 2) {
      const operator = parts[i];
      const value = parseFloat(parts[i + 1]);
      switch (operator) {
        case "+": total += value; break;
        case "-": total -= value; break;
        case "×": total *= value; break;
        case "÷":
          if (value === 0) {
            setWarning("Cannot divide by zero");
            resultEl.textContent = "Error";
            return;
          }
          total /= value;
          break;
      }
    }
    expression = "";
    current = String(parseFloat(total.toPrecision(12)));
    render();
  }

  function clearAll() {
    expression = "";
    current = "";
    lastWasOperator = false;
    setWarning("");
    render();
  }

  function backspace() {
    setWarning("");
    if (current !== "") {
      current = current.slice(0, -1);
    } else if (expression !== "") {
      expression = expression.trim().replace(/ ?[+\-×÷]$/, "");
    }
    render();
  }

  document.querySelectorAll("[data-num]").forEach(btn => {
    btn.addEventListener("click", () => appendNumber(btn.dataset.num));
  });

  document.querySelectorAll("[data-op]").forEach(btn => {
    btn.addEventListener("click", () => chooseOperator(btn.dataset.op));
  });

  document.getElementById("clear").addEventListener("click", clearAll);
  document.getElementById("backspace").addEventListener("click", backspace);
  document.getElementById("equals").addEventListener("click", calculate);

  document.addEventListener("keydown", e => {
    if (/[0-9.]/.test(e.key)) appendNumber(e.key);
    else if (e.key === "+" || e.key === "-") chooseOperator(e.key);
    else if (e.key === "*") chooseOperator("×");
    else if (e.key === "/") { e.preventDefault(); chooseOperator("÷"); }
    else if (e.key === "Enter" || e.key === "=") calculate();
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Escape") clearAll();
  });

  render();
</script>
</body>
</html>
